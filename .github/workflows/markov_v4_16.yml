name: markov-v4-16-exploratory

on:
  push:
    branches:
      - analysis/markov-v4-16-exploratory
    paths:
      - 'src/markov_probability_v4_16.py'
      - '.github/workflows/markov_v4_16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markov-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install tabulate

      - name: Run exploratory Markov backtest
        run: python -m src.markov_probability_v4_16

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: markov-v4-16-results
          path: outputs/markov_v4_16_exploratory/
          retention-days: 7
