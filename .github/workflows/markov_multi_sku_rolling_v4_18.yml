name: markov-multi-sku-rolling-v4-18
on:
  push:
    branches: [analysis/markov-v4-16-exploratory]
    paths:
      - 'src/markov_multi_sku_rolling_v4_18.py'
      - '.github/workflows/markov_multi_sku_rolling_v4_18.yml'
  workflow_dispatch:
jobs:
  rolling-sample:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install tabulate
      - name: Run multi-SKU rolling sample
        run: python -m src.markov_multi_sku_rolling_v4_18
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: markov-multi-sku-rolling-v4-18
          path: outputs/markov_v4_18_multi_sku_rolling/
          retention-days: 7
