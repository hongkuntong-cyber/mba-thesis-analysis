project:
  name: mba-thesis-analysis-business-forecast
  protocol_version: "3.1"
  analysis_mode: retrospective_method_development
  seed: 42
  timezone: UTC

input:
  workbook: "01_原始数据/德国Amazon_SKU周度数据_原始合并版_未清洗 (1).xlsx"
  metadata_columns: 8
  sku_column: "SKU"
  expected_sha256: "ece008d42c9dd6ea11e4a0c8f6d828c2cb037df1d837ea233587f115491786b6"
  calendar:
    week_start: monday
    merge_same_iso_week_fragments: true
    minimum_covered_days: 7

cleaning_v2:
  zero_run_min: 2
  zero_run_max: 12
  context_window_max: 12
  minimum_positive_share: 0.75
  minimum_positive_weeks_each_side: 3
  probability_cutoff: 0.05
  correct_leading_or_trailing_runs: false

samples:
  main_min_positive_weeks: 5

features:
  evidence_registry: protocol/feature_evidence_registry_v3.csv
  evidence_registry_sha256: "12283853551a97c65d5dd5cda121dea0fa581b57c1a860afbe6258755f7d4db0"
  required_anchors: [ADI, CV2]

clustering:
  algorithm: ward
  k: 2
  stability:
    repetitions: 500
    debug_repetitions: 10
    sample_fraction: 0.80
  structural_gates:
    minimum_cluster_jaccard_median: 0.75
    minimum_cluster_size: 10
    minimum_cluster_share: 0.05
  forecast_selection:
    rule: pareto_then_maximize_stability_p10
    tie_breakers: [n_features_ascending, stability_median_descending, silhouette_descending, feature_set_ascending]

forecast:
  total_backtest_weeks: 48
  horizon_weeks: 8
  origins: 6
  development_origins: 5
  historical_evaluation_origin: 6
  models: [MA4_proxy, Naive, SES, ADIDA2]
  value_baseline: Zero
  adida_aggregation_weeks: 2
  cluster_pools:
    "1": [MA4_proxy, Naive, SES]
    "2": [MA4_proxy, Naive, ADIDA2]
  shadow_models:
    "1": [ADIDA2]
    "2": [SES]
  routing:
    minimum_valid_origins: 3
    minimum_winning_origins: 3
    complex_min_relative_improvement: 0.05
    simple_tie_relative_gap: 0.02
    impact_quantile: 0.50

evaluation:
  paired_bootstrap_repetitions: 1000
  metrics: [mean_mase, median_mase, mase_lt_1_share, mae, aggregate_wape, bias]

outputs:
  root: outputs/business_forecast_v3
  report: reports/business_forecast_review_v3.md
